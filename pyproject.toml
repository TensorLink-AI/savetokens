[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "savetokens"
version = "0.2.0"
description = "Know when you'll run out of Claude: limit forecasts and pace alerts across machines and accounts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TensorLink" }]
keywords = ["claude-code", "rate-limit", "forecasting", "usage", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = ["gnomon-forecast>=1.4"]

[project.scripts]
savetokens = "savetokens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/savetokens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
